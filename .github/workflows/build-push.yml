name: Docker Image CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build AMD64 image
        run: docker buildx build --platform linux/amd64 --load -t tego:ci .

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment: Docker Hub
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push AMD64 image to Docker Hub
        run: |
          docker buildx build --load --platform linux/amd64 -t microcharon/tego:latest-amd64 .
          docker push microcharon/tego:latest-amd64

      - name: Build and push ARM64 image to Docker Hub
        run: |
          docker buildx build --load --platform linux/arm64 -t microcharon/tego:latest-arm64 .
          docker push microcharon/tego:latest-arm64

      - name: Create and push manifest to Docker Hub
        run: |
          docker manifest create microcharon/tego:latest microcharon/tego:latest-amd64 microcharon/tego:latest-arm64 --amend
          docker manifest push microcharon/tego:latest
