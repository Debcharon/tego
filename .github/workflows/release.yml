name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate release tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v1\.(20[0-9]{2})(0[1-9]|1[0-2])(0[1-9]|[12][0-9]|3[01])\.([0-9]|[1-9][0-9]+)$ ]] || { echo "Expected v1.YYYYMMDD.N, such as v1.20260924.0" >&2; exit 1; }
          release_date="${BASH_REMATCH[1]}-${BASH_REMATCH[2]}-${BASH_REMATCH[3]}"
          [[ "$(date -u -d "$release_date" +%Y-%m-%d 2>/dev/null)" == "$release_date" ]] || { echo "Invalid release date" >&2; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...

  publish-image:
    needs: verify
    runs-on: ubuntu-latest
    environment: Docker Hub
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish versioned image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            microcharon/tego:${{ github.ref_name }}
            ghcr.io/debcharon/tego:${{ github.ref_name }}

  publish-release:
    needs: publish-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Package release binaries
        shell: bash
        run: |
          set -euo pipefail
          version="$GITHUB_REF_NAME"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 windows/amd64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="tego_${version}_${os}_${arch}"
            work="$(mktemp -d)"
            mkdir -p "$work/data"
            binary="tego"
            if [[ "$os" == windows ]]; then binary="tego.exe"; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X main.version=$version" -o "$work/$binary" .
            cp README.md README_CN.md LICENSE "$work/"
            cp data/config.example.json "$work/data/"
            if [[ "$os" == windows ]]; then
              (cd "$work" && zip -qr "$GITHUB_WORKSPACE/dist/$name.zip" .)
            else
              tar -C "$work" -czf "dist/$name.tar.gz" .
            fi
            rm -rf "$work"
          done
          (cd dist && sha256sum tego_* > checksums.txt)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
